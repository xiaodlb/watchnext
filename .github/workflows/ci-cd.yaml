name: WatchNext CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: watchnext-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend and shared tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run backend and shared tests
        run: pnpm exec vitest run --exclude 'tests/frontend/**'
      - name: Check TypeScript
        run: pnpm typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Lovable frontend dependencies from its lockfile
        run: pnpm --dir lovable-frontend install --ignore-workspace --frozen-lockfile
      - name: Run Lovable UI tests
        run: pnpm --dir lovable-frontend test
      - name: Run root frontend mock tests
        run: pnpm test tests/frontend

  build_and_publish:
    name: Build, test and publish ARM64 and AMD64 images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 120
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - uses: docker/setup-qemu-action@v3
      - name: Create immutable UTC image tag
        id: image
        shell: bash
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and test both architecture images
        env:
          WATCHNEXT_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          release_tag="$WATCHNEXT_IMAGE_TAG"
          for arch in amd64 arm64; do
            export WATCHNEXT_TARGET_PLATFORM="linux/${arch}"
            export WATCHNEXT_IMAGE_TAG="${release_tag}-${arch}"
            export WATCHNEXT_E2E_IMAGE="ghcr.io/xiaodlb/watchnext:${WATCHNEXT_IMAGE_TAG}"
            docker compose --project-name watchnext-ci \
              -f docker-compose.yaml -f deploy/oci/compose-ci.yaml build app
            docker image inspect "$WATCHNEXT_E2E_IMAGE" \
              --format '{{.Os}}/{{.Architecture}}' | grep -Fx "$WATCHNEXT_TARGET_PLATFORM"
            pnpm test:e2e:compose
            pnpm test:e2e:readiness
            pnpm test:e2e:migrations
          done
      - name: Set up manifest builder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
      - name: Publish both tested images and their shared manifest to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHNEXT_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            docker push "ghcr.io/xiaodlb/watchnext:${WATCHNEXT_IMAGE_TAG}-${arch}"
          done
          docker buildx imagetools create \
            --tag "ghcr.io/xiaodlb/watchnext:${WATCHNEXT_IMAGE_TAG}" \
            "ghcr.io/xiaodlb/watchnext:${WATCHNEXT_IMAGE_TAG}-amd64" \
            "ghcr.io/xiaodlb/watchnext:${WATCHNEXT_IMAGE_TAG}-arm64"
          docker buildx imagetools inspect "ghcr.io/xiaodlb/watchnext:${WATCHNEXT_IMAGE_TAG}"

      - name: Record published dev image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Published ghcr.io/xiaodlb/watchnext:${{ steps.image.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy dev image from GHCR
    runs-on: ubuntu-latest
    needs: [build_and_publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OCI_DEPLOY_ENABLED == 'true'
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_IDENTITY_DOMAIN_URL: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
      OCI_OAUTH_CLIENT_ID: ${{ vars.OCI_OAUTH_CLIENT_ID }}
      OCI_OIDC_AUDIENCE: watchnext-oci-github-actions
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_INSTANCE_OCID: ${{ vars.OCI_INSTANCE_OCID }}
      WATCHNEXT_APP_ORIGIN: ${{ vars.WATCHNEXT_APP_ORIGIN }}
      WATCHNEXT_IMAGE_TAG: ${{ needs.build_and_publish.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${OCI_REGION:?Set repository variable OCI_REGION}"
          : "${OCI_IDENTITY_DOMAIN_URL:?Set repository variable OCI_IDENTITY_DOMAIN_URL}"
          : "${OCI_OAUTH_CLIENT_ID:?Set repository variable OCI_OAUTH_CLIENT_ID}"
          : "${OCI_COMPARTMENT_OCID:?Set repository variable OCI_COMPARTMENT_OCID}"
          : "${OCI_INSTANCE_OCID:?Set repository variable OCI_INSTANCE_OCID}"
          : "${WATCHNEXT_APP_ORIGIN:?Set repository variable WATCHNEXT_APP_ORIGIN}"
          [[ "$OCI_IDENTITY_DOMAIN_URL" =~ ^https://[^/]+/?$ ]]
          [[ "$WATCHNEXT_APP_ORIGIN" =~ ^https://[^/]+$ ]]
          [[ "$OCI_REGION" =~ ^[a-z0-9-]+$ ]]
          [[ "$OCI_COMPARTMENT_OCID" == ocid1.compartment.* ]]
          [[ "$OCI_INSTANCE_OCID" == ocid1.instance.* ]]
          [[ "$WATCHNEXT_IMAGE_TAG" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]]
      - name: Exchange GitHub OIDC token for a short-lived OCI RPST
        env:
          OCI_OAUTH_CLIENT_SECRET: ${{ secrets.OCI_OAUTH_CLIENT_SECRET }}
        run: bash deploy/oci/exchange-rpst.sh
      - name: Install OCI CLI
        run: pipx install 'oci-cli==3.95.1'
      - name: Submit and wait for the OCI Instance Agent Run Command
        run: bash deploy/oci/submit-run-command.sh
      - name: Check live HTTPS health endpoint
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 24 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            "${WATCHNEXT_APP_ORIGIN%/}/health/readyz" >/dev/null
          echo "Deployment healthy at ${WATCHNEXT_APP_ORIGIN%/}/health/readyz"
      - name: Remove short-lived credentials
        if: always()
        run: |
          if [[ -n "${WIF_TEMP_DIR:-}" && "$WIF_TEMP_DIR" == "$RUNNER_TEMP"/watchnext-oci-wif.* ]]; then
            rm -rf -- "$WIF_TEMP_DIR"
          fi

  dev-deploy-disabled:
    name: OCI deployment disabled
    runs-on: ubuntu-latest
    needs: [build_and_publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OCI_DEPLOY_ENABLED != 'true'
    steps:
      - name: Explain how to enable deployment
        run: |
          echo 'Image ghcr.io/xiaodlb/watchnext:${{ needs.build_and_publish.outputs.image_tag }} was tested and published. Dev deployment is disabled; set OCI_DEPLOY_ENABLED=true after completing _docs/deploy-oci-cicd.md.' >> "$GITHUB_STEP_SUMMARY"
